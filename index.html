
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Streetwear Denim</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #121212; color: #ffffff; scroll-behavior: smooth; }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; background: #1a1a1a; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 24px; font-weight: bold; color: #ff5e00; }
        .nav-links { list-style: none; display: flex; gap: 20px; }
        .nav-links a { color: white; text-decoration: none; font-weight: 500; transition: 0.3s; }
        .nav-links a:hover { color: #ff5e00; }
        .hero { height: 70vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1542272604-787c3835535d?q=80&w=1000') center/cover; padding: 0 20px; }
        .hero h1 { font-size: 48px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }
        .hero p { font-size: 18px; margin-bottom: 20px; color: #ccc; }
        .btn { padding: 12px 30px; background: #ff5e00; color: white; border: none; font-size: 16px; font-weight: bold; cursor: pointer; text-decoration: none; border-radius: 5px; transition: 0.3s; }
        .btn:hover { background: #e05300; box-shadow: 0 0 15px #ff5e00; }
        .products { padding: 60px 5%; text-align: center; }
        .products h2 { font-size: 36px; margin-bottom: 40px; text-transform: uppercase; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; }
        .card { background: #1a1a1a; padding: 20px; border-radius: 8px; border: 1px solid #333; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: #ff5e00; }
        .card h3 { margin: 15px 0 10px; font-size: 20px; }
        .card p { color: #ff5e00; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>
    <nav>
        <div class="logo">RAW DENIM</div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Collection</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
    <section class="hero">
        <h1>Hand-Distressed Streetwear</h1>
        <p>Premium slim-fit jeans customized with unique rips, patches, and raw details.</p>
        <a href="#" class="btn">Explore Collection</a>
    </section>
    <section class="products">
        <h2>Featured Custom Work</h2>
        <div class="grid">
            <div class="card">
                <h3>Vintage Ripped Black</h3>
                <p>$89.99</p>
            </div>
            <div class="card">
                <h3>Custom Patch Denim</h3>
                <p>$95.00</p>
            </div>
            <div class="card">
                <h3>Street Distressed Slim</h3>
                <p>$79.99</p>
            </div>
        </div>
    </section>
</body>
</html>
